when:
    - event: tag
      branch: main
      ref: refs/tags/v*

variables:
    - &build_platforms "linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64"
    - &golang "golang:1.25-alpine"
    - &golangci_lint "golangci/golangci-lint:v2.12-alpine"
    - &release_plugin "codeberg.org/woodpecker-plugins/release"

steps:
    vendor:
        image: *golang
        commands:
            - go mod vendor

    lint:
        image: *golangci_lint
        commands:
            - golangci-lint run

    test:
        image: *golang
        commands:
            - go test ./...

    build:
        image: *golang
        environment:
            PLATFORMS: *build_platforms
        commands:
            - mkdir -p dist
            - |
                for PLATFORM in $$PLATFORMS; do
                  GOOS=$${PLATFORM%/*}
                  GOARCH=$${PLATFORM#*/}
                  EXT=""
                  if [ "$$GOOS" = "windows" ]; then EXT=".exe"; fi

                  echo "Building for $$GOOS/$$GOARCH..."
                  GOOS=$$GOOS GOARCH=$$GOARCH go build \
                    -ldflags="-s -w" \
                    -o "dist/parsec-$${GOOS}-$${GOARCH}$${EXT}"
                  
                done

    release:
        image: *release_plugin
        settings:
            api_key:
                from_secret: forge_token
            files:
                - dist/*
            title: ${CI_COMMIT_TAG}
            generate_release_notes: true
