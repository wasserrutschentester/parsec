when:
    - event: tag
      branch: main
      ref:
          include:
              ["refs/tags/v0.[1-9]*", "refs/tags/v[1-9]*", "refs/tags/nightly"]

variables:
    - &build_platforms "linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64"
    - &golang "golang:1.25-alpine"
    - &golang_cgo "golang:1.25"
    - &golangci_lint "golangci/golangci-lint:v2.12-alpine"
    - &release_plugin "codeberg.org/woodpecker-plugins/release"
    - &docker_buildx "woodpeckerci/plugin-docker-buildx"
    - &release_settings
      api_key:
          from_secret: PARSEC_FORGE_TOKEN
      files:
          - dist/*
      checksum:
          - sha256
      checksum_file: checksums.txt
      checksum_flatten: true
      target_commitish: main
      note: RELEASE_NOTES.md
      overwrite: true

clone:
    git:
        image: woodpeckerci/plugin-git
        settings:
            partial: false
            depth: 0

steps:
    generate-version:
        image: alpine/git
        commands:
            - |
                if [ -n "$CI_COMMIT_TAG" ] && [ "$CI_COMMIT_TAG" != "nightly" ]; then
                  VERSION="$CI_COMMIT_TAG"
                  echo "latest" > .tags
                  git tag -d nightly 2>/dev/null || true
                else
                  VERSION=$(sh ./scripts/version.sh)
                  echo "nightly" > .tags
                fi
                echo "$VERSION" > .version
                echo "$VERSION" | tr '+' '-' >> .tags
                echo "VERSION=$VERSION" > .env

    vendor:
        image: *golang
        commands: go mod vendor

    lint:
        image: *golangci_lint
        commands: golangci-lint run

    test:
        image: *golang_cgo
        commands: go test -race -cover ./...

    changelog:
        image: orhunp/git-cliff:latest
        environment:
            GITEA_REPO: upPollo/parsec
            GITEA_API_URL: https://codeberg.org
            GITEA_TOKEN:
                from_secret: PARSEC_FORGE_TOKEN
        commands:
            - |
                VERSION=$(cat .version)
                if [ "$CI_COMMIT_TAG" = "nightly" ]; then
                  git-cliff --unreleased --tag "$VERSION" --strip all --output RELEASE_NOTES.md
                else
                  git-cliff --current --strip all --output RELEASE_NOTES.md
                fi

    build:
        image: *golang
        environment:
            PLATFORMS: *build_platforms
        commands:
            - mkdir -p dist
            - |
                VERSION=$$(cat .version)
                for PLATFORM in $$PLATFORMS; do
                  GOOS=$${PLATFORM%/*}
                  GOARCH=$${PLATFORM#*/}
                  EXT=""
                  if [ "$$GOOS" = "windows" ]; then EXT=".exe"; fi

                  echo "Building for $$GOOS/$$GOARCH..."
                  GOOS=$$GOOS GOARCH=$$GOARCH go build \
                    -ldflags="-s -w -X codeberg.org/upPollo/parsec/cmd.Version=$$VERSION" \
                    -o "dist/parsec-$${GOOS}-$${GOARCH}$${EXT}"
                done

    docker:
        image: *docker_buildx
        settings:
            repo: uppollo/parsec,codeberg.org/uppollo/parsec
            dockerfile: ./docker/Dockerfile
            platforms: linux/amd64,linux/arm64
            tags_file: .tags
            env_file: .env
            build_args_from_env:
                - VERSION
            auto_labels: true
            logins:
                - registry: https://index.docker.io/v1/
                  username:
                      from_secret: DOCKERHUB_USERNAME
                  password:
                      from_secret: DOCKERHUB_TOKEN
                - registry: https://codeberg.org
                  username:
                      from_secret: CODEBERG_USERNAME
                  password:
                      from_secret: CODEBERG_TOKEN

    release-nightly:
        image: *release_plugin
        settings:
            <<: *release_settings
            tag: nightly
            title: nightly
            prerelease: true
        when:
            ref: refs/tags/nightly

    release-tag:
        image: *release_plugin
        settings:
            <<: *release_settings
            tag: ${CI_COMMIT_TAG}
            title: ${CI_COMMIT_TAG}
            prerelease: false
        when:
            ref:
                include: ["refs/tags/v0.[1-9]*", "refs/tags/v[1-9]*"]
