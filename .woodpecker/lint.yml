when:
    - event: [push, pull_request]

variables:
    - &golang "golang:1.25-alpine"
    - &golangci_lint "golangci/golangci-lint:v2.12-alpine"

steps:
    vendor:
        image: *golang
        commands: go mod vendor

    lint:
        image: *golangci_lint
        commands: golangci-lint run
        when:
            - event: pull_request
            - event: push
              branch: "renovate/*"

    test:
        image: *golang
        commands: go test ./...
