# git-cliff configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""

body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**({{ commit.scope }})** {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
{% if gitea and gitea.contributors | length > 0 %}
  ### 👤 Contributors
  {% for contributor in gitea.contributors %}
    - @{{ contributor.username }}
  {% endfor %}
{% endif %}
{% if previous.version %}\
    **Full Changelog**: https://codeberg.org/upPollo/parsec/compare/{{ previous.version }}...{{ version }}
{% endif %}\n
"""

footer = """
<!-- generated by git-cliff -->
"""
# remove the leading and trailing s
trim = true

postprocessors = [
  { pattern = '<!-- \d+ -->', replace = "" }, # remove sorting markers
]

[git]
# parse commits according to the conventional commits spec
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = false
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing the commit messages
commit_preprocessors = [
  { pattern = '#([0-9]+)', replace = '[#${1}](https://codeberg.org/upPollo/parsec/issues/${1})' },
  # Join lines that were split without an empty line (fixes "Incorrect body syntax")
  { pattern = '^(\w+(\([^)]+\))?: [^\n]+)\n([^\n])', replace = "$1\n\n$3" },
  # Normalize types to lowercase and preserve scopes
  { pattern = '^(?i)feat(\([^)]+\))?:', replace = 'feat$1:' },
  { pattern = '^(?i)fix(\([^)]+\))?:', replace = 'fix$1:' },
  { pattern = '^(?i)doc(s)?(\([^)]+\))?:', replace = 'docs$2:' },
  { pattern = '^(?i)perf(\([^)]+\))?:', replace = 'perf$1:' },
  { pattern = '^(?i)refactor(\([^)]+\))?:', replace = 'refactor$1:' },
  { pattern = '^(?i)style(\([^)]+\))?:', replace = 'style$1:' },
  { pattern = '^(?i)test(\([^)]+\))?:', replace = 'test$1:' },
  { pattern = '^(?i)chore(\([^)]+\))?:', replace = 'chore$1:' },
  { pattern = '^(?i)ci(\([^)]+\))?:', replace = 'chore(ci)$1:' },
  # Fix common typos and formatting
  { pattern = '^set (.*)', replace = 'chore: set ${1}' },
  { pattern = '^add unit tests (.*)', replace = 'test: add unit tests ${1}' },
  { pattern = '^testing: (.*)', replace = 'test: ${1}' },
  { pattern = '\(make linter happy\)', replace = '' },
  { pattern = 'respomses', replace = 'responses' },
  { pattern = '\.$', replace = '' },
]
# regex for parsing and grouping commits
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
  { message = "^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore\\(deps\\)", group = "<!-- 7 -->📦 Dependencies" },
  { message = "^chore|ci", group = "<!-- 8 -->⚙️ Miscellaneous Tasks" },
  { body = ".*breaking", group = "<!-- 00 -->⚠️ Breaking Changes" },
  { message = ".*", group = "<!-- 9 -->Other" },
]
# protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = true
# filter out the commits that are not matched by commit_parsers
filter_commits = false
# glob pattern for matching git tags
tag_pattern = "v[0-9]*"
# sort the tags topologically
topo_order = true
# sort the commits inside sections by message
sort_commits = "oldest"
