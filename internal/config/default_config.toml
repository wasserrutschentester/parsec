# Configuration documentation is available at
# https://codeberg.org/upPollo/parsec/src/branch/main/docs/config.md

# Your release group Name (should only contain alphanumeric characters and be unique)
group = "NoRealGrpPlsChange"

# Default source for releases (Value in Filename or from flag is prioritized over this setting)
source = "WEB-DL"

# Preferred language for identification, tagging, and track ordering
preferred_language = "de"

# Place original language audio tracks before preferred language tracks in track ordering
original_audio_first = false

# If true, sets {language} to preferred_language and {language_ext} to "SUBBED"
# if no audio is present but subs are available in the preferred language
subbed_tagging = true

# Naming template for releases
# for what is available see https://codeberg.org/upPollo/parsec/src/branch/main/docs/templates.md
template = '{{join "." .Title .YearTag .SeasonEpisode .Edition .EpisodeTitle .VersionTag .RepackTag .LanguageName .LanguageExtra .Accessibility .Resolution .Service .Source .AudioSpec .HDR .VideoCodec}}-{{.Group}}'

# Default template to use for NFO generation
nfogen_template = "default"

# Display names for video codecs
video_codec_avc = "H.264"
video_codec_hevc = "H.265"

# Character used to replace spaces in titles, episode titles, and codecs.
word_separator = "."

# Replace diacritics and special characters with their ASCII equivalents (e.g., ä -> ae, ß -> ss)
normalize_diacritics = true

# Path where to move files after renaming (absolute or relative to cwd)
# output_path = ""

# Video codec styling matrix
# Automatically maps video codecs based on release type (web_dl, remux, encode)
[video_codec_style.web_dl]
AVC = "H.264"
HEVC = "H.265"

[video_codec_style.remux]
AVC = "AVC"
HEVC = "HEVC"

[video_codec_style.encode]
AVC = "x264"
HEVC = "x265"

# Custom regex replacements applied to the Title and Episode Title before normalization.
# Replaces `title_cleaning_regex`.
[[replacements.title]]
pattern = '(?i)(\s*\|.*|\s*\((Teil|Part)\s*\d+\))'
replacement = ''

[[replacements.title]]
pattern = '&'
replacement = 'und'

[[replacements.input]]
pattern = '(?i)(Fernseh|Dokumentar|Spiel|Kurz|Animations|Maerchen|Märchen)film.*(Deutschland|Oesterreich|Österreich|Schweiz|DDR)'
replacement = ''

# Regex replacements applied to the raw filename before parsing.
# They are processed in the order they appear.
[[replacements.input]]
pattern = '(?i)(Fernseh|Dokumentar|Spiel|Kurz|Animations|Maerchen|Märchen)film.*(Deutschland|Oesterreich|Österreich|Schweiz|DDR)'
replacement = ''


# Regex replacements applied to the final generated filename string.
# [[replacements.output]]
# pattern = 'BluRay'
# replacement = 'Blu-Ray'

# Api keys for Media Databases (required for most features)
[api_keys]
tmdb = "your_tmdb_api_key" # https://developer.themoviedb.org/docs/getting-started
tvdb = "your_tvdb_api_key" # https://thetvdb.com/api-information
# Optional. Used only by `correct` if a missing subtitle font is not available from
# local system fonts or the keyless Google Fonts GitHub repository.
google_fonts = "" # https://developers.google.com/fonts/docs/developer_api

# Prowlarr configuration for release searching
[prowlarr]
url = "http://localhost:9696" # e.g. http://localhost:9696
api_key = "your_prowlarr_api_key"
indexers = [] # Array of indexer IDs to limit the search (empty for all)

[update]
# Automatically check for updates in the background
check = true

# Automatically download and install updates in the background
auto = false

# Check for prerelease/nightly updates
prerelease = false


# ---------------------------------- #
#        SOME EXAMPLE PRESETS        #
# ---------------------------------- #

# ------------------------------------------------------------------------------
# PRESET: mandalorian
# Use case: Automatically identify a specific show without needing to parse it.
# Useful for automation or when the file name is ambiguous.
# ------------------------------------------------------------------------------
[preset.mandalorian]
description = "Mandalorian on DSNP"
title = "The Mandalorian"
tmdb_id = 82856
is_tv = true
service = "DSNP"
# source = "WEB-DL" # Doesn't need to be set since it's already set in default preset

# ------------------------------------------------------------------------------
# PRESET: remux
# Use case: High-quality BluRay Remuxes.
# use REMUX keyword and change order of video and audio codec info
# ------------------------------------------------------------------------------
[preset.movie-remux]
description = "HEVC/AVC codec labels"
source = "BluRay"
video_codec_hevc = "HEVC"
video_codec_avc = "AVC"
template = "{title}.{year}.{resolution}.{source}.REMUX.{video_codec}.{audio_codec}.{audio_channels}-{group}"

# ------------------------------------------------------------------------------
# PRESET: encode
# Use case: Name of the encoding library is used as the video codec.
# ------------------------------------------------------------------------------
[preset.encode]
description = "x264/x265 codec labels"
source = "BluRay"
video_codec_hevc = "x265"
video_codec_avc = "x264"

# ------------------------------------------------------------------------------
# PRESET: quick-check
# Use case: Fast validation during ingest.
# Disables some verbose and opinionated checks.
# ------------------------------------------------------------------------------
[preset.quick-check]
description = "disables verbose/opinionated checks"
disabled_checks = [
    "filename_sequences",
    "mediainfo_bitrate",
    "matroska_track_order",
    "matroska_name_quality"
]

# ------------------------------------------------------------------------------
# PRESET: tvnation
# Use case: disable all checks except for disallowed filename characters
# ------------------------------------------------------------------------------
[preset.tvnation]
description = "disable almost all checks"
enabled_checks = ["filename_characters"]

# ------------------------------------------------------------------------------
# PRESET: special
# Use case: For handling TV specials and extras.
# Enables matching title/Aired date against Season 0 for TVDB
# ------------------------------------------------------------------------------
[preset.special]
description = "TV specials and extras"
allow_special_matches = true
season = 0
is_tv = true
template = "{title}.{year}.{season_id}{episode_id}.{date}.{episode_title}.{resolution}.{service}.{source}.{video_codec}-{group}"

# ------------------------------------------------------------------------------
# PRESET: anime
# Use case: Naming scheme following the parsec naming guide for anime.
# ------------------------------------------------------------------------------
[preset.anime]
description = "CRC32 brackets and spaces"
is_tv = true
word_separator = " "
template = "[{group}] {title} - {season_id}{episode_id} - ({source} {resolution} {video_codec} {audio_codec}) {dual_audio} [{crc32}]"

# ------------------------------------------------------------------------------
# TRACKER PRESETS
# ------------------------------------------------------------------------------
# TRACKER PRESETS
# ------------------------------------------------------------------------------

# --- TorrentSyndikat (TS / German Scene) ---
[preset.ts]
description = "TorrentSyndikat (German Scene)"
word_separator = "."
template = '{{join "." .Title .YearTag .SeasonEpisode .Edition .EpisodeTitle .LanguageName .LanguageExtra .Accessibility .VersionTag .RepackTag .Resolution .Service .Source .AudioCodec .HDR .VideoCodec}}-{{.Group}}'

[preset.ts_daily]
description = "TorrentSyndikat Daily"
word_separator = "."
template = '{{join "." .Title (parseDate "2006.01.02" .Date) .Edition .EpisodeTitle .LanguageName .LanguageExtra .Accessibility .VersionTag .RepackTag .Resolution .Service .Source .AudioCodec .HDR .VideoCodec}}-{{.Group}}'

# --- Aither (UNIT3D / International P2P) ---
[preset.aither]
description = "Aither (UNIT3D / International P2P)"
word_separator = " "
preferred_language = "en"
template = '{{join " " (aka .Title .OriginalTitle) .YearTag .SeasonEpisode (upper .EpisodeTitle) .Edition .VersionTag .RepackTag (cond .HasPreferredAudio "" .LanguageName) .Resolution .Service .Source (cond .IsDualAudio "Dual-Audio" "") .AudioCodec .AudioChannels .AudioExtra .HDR .VideoCodec}}-{{.Group}}'

[preset.aither_remux]
description = "Aither Remux"
word_separator = " "
preferred_language = "en"
template = '{{join " " (aka .Title .OriginalTitle) .YearTag .SeasonEpisode (upper .EpisodeTitle) .Edition .VersionTag .RepackTag (cond .HasPreferredAudio "" .LanguageName) .Resolution .Source "REMUX" .HDR .VideoCodec (cond .IsDualAudio "Dual-Audio" "") .AudioCodec .AudioChannels .AudioExtra}}-{{.Group}}'

# --- HUNO ---
[preset.huno]
description = "HUNO"
word_separator = " "
preferred_language = "en"
template = '{{.Title}} ({{.YearTag}}) {{.SeasonEpisode}} {{.Edition}} ({{join " " .Resolution .Service .Source (cond .IsRemux "REMUX" "") .VideoCodec .HDR .AudioCodec .AudioChannels (when .IsMultiAudio "MULTI" .IsDualAudio "DUAL" (title .LanguageName))}} - {{.Group}}) {{when .IsSubbed "[SUBBED]" .RepackTag (cat "[" .RepackTag "]") ""}}'

# --- Nacho (P2P Encoders) ---
[preset.nacho]
description = "Nacho (P2P Encoders)"
word_separator = "."
template = '{{join "." (aka "." .Title .OriginalTitle .YearTag) .Edition .VersionTag .RepackTag .Resolution .Service .Source .AudioSpec .HDR .VideoCodec}}-{{.Group}}'

[preset.nacho_remux]
description = "Nacho Remux"
word_separator = "."
template = '{{join "." (aka "." .Title .OriginalTitle .YearTag) .Edition .VersionTag .Resolution .Source "Remux" .HDR .VideoCodec .AudioSpec}}-{{.Group}}'

# --- Handjob (PTP Encoders) ---
[preset.handjob]
description = "Handjob (PTP Encoders)"
word_separator = "."
template = '{{join "." (aka "." .Title .OriginalTitle) (when .IsTV (cat .EpisodeID "." (join "." .EpisodeTitles)) "") .YearTag .Edition (when (ne .Source "DVDRip") .Resolution "") .Source (when (contains .AudioCodec "FLAC AAC DTS") .AudioCodec "") .VideoCodec}}-HANDJOB'

# --- MixMux (Boutique Remuxes) ---
[preset.mixmux]
description = "MixMux (Boutique Remuxes)"
word_separator = "."
template = '{{join "." .Title .YearTag .Country .Edition .Resolution "Bluray.Remux" .VideoCodec .AudioCodec .AudioChannels}}-MIXMUX'



